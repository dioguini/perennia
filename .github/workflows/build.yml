# Gera as versões para partilhar, nas máquinas do GitHub.
#
# Corre sozinho quando crias uma etiqueta v1.0.1, v1.1.0… (e põe os ficheiros
# numa Release), ou à mão em Actions → "Build" → "Run workflow" (os ficheiros
# ficam em Artifacts, no fundo da página da execução).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -t .
          python main.py --self-test

      - name: Empacotar (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging\perennia.spec
          xcopy /E /I /Y gpx dist\Perennia\gpx
          xcopy /E /I /Y workouts dist\Perennia\workouts
          copy /Y packaging\LEIA-ME.txt dist\Perennia\LEIA-ME.txt
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\Perennia' -DestinationPath 'dist\Perennia-windows.zip' -Force"

      - name: Empacotar (macOS e Linux)
        if: runner.os != 'Windows'
        run: PYTHON=python ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Perennia-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
